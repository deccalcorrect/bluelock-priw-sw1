<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Oyuncu Stat Paneli
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<header>

<h1>
⚽ Oyuncu Stat Paneli
</h1>

</header>



<main>



<!-- =========================
OYUNCU PANELİ
========================= -->


<section class="panel">


<h2>
Oyuncu Oluştur
</h2>



<input 
id="playerName"
placeholder="Oyuncu adı">



<label>
Oyuncu Fotoğrafı
</label>


<input
type="file"
id="playerImage"
accept="image/*"
>




<input
id="playerPosition"
placeholder="Mevki">



<input
id="playerAge"
placeholder="Yaş">



<input
id="playerHeight"
placeholder="Boy">



<input
id="playerWeight"
placeholder="Kilo">





<input
id="playerGoals"
type="number"
placeholder="Gol"
>



<input
id="playerAssists"
type="number"
placeholder="Asist"
>



<h3>
Normal Statlar
</h3>


<div id="statsContainer">

</div>



<button onclick="addStat()">

+ Stat Ekle

</button>





<h3>
Fiziksel Özellikler
</h3>



<div id="physicalContainer">

</div>



<button onclick="addPhysicalStat()">

+ Fiziksel Stat Ekle

</button>






<h3>
Takım Seç
</h3>



<select id="playerTeam">

<option value="">

Takım seç

</option>


</select>





<br><br>



<button onclick="savePlayer()">

Oyuncuyu Kaydet

</button>



</section>




<!-- =========================
TAKIM OLUŞTURMA
========================= -->


<section class="panel">


<h2>
🏟️ Takım Oluştur
</h2>



<input

id="teamName"

placeholder="Takım adı"

>



<input

id="teamLogo"

placeholder="Logo URL"

>



<button onclick="addTeam()">

Takım Ekle

</button>



</section>









<!-- =========================
OYUNCULAR
========================= -->


<section class="panel">


<h2>
👤 Oyuncular
</h2>



<div id="playersList">


</div>



</section>









<!-- =========================
TAKIMLAR
========================= -->


<section class="panel">


<h2>
🏆 Takımlar
</h2>



<div id="teamsList">


</div>



</section>





<!-- =========================
GOL KRALLIĞI
========================= -->


<section class="panel">


<h2>
⚽ Gol Krallığı
</h2>



<div id="goalList">


</div>



</section>









<!-- =========================
ASİST KRALLIĞI
========================= -->


<section class="panel">


<h2>
🅰️ Asist Krallığı
</h2>



<div id="assistList">


</div>



</section>









<!-- =========================
ADMIN STAT GÜNCELLEME
========================= -->


<section class="panel">


<h2>
🔒 Admin Stat Güncelleme
</h2>



<select id="statPlayer">


<option value="">

Oyuncu seç

</option>


</select>





<textarea

id="statText"

placeholder="
Örnek:

Hız:90
Şut:85
Pas:88

"

></textarea>





<button onclick="transferStats()">

Statları Aktar

</button>



</section>









</main>








<script 
type="module"
src="./App.js">
</script>



</body>


</html>
