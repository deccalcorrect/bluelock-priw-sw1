<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bluelock Priw SW</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>⚽ Bluelock Priw SW</h1>

<p>Oyuncu Yönetim Paneli</p>

</header>



<main>


<section class="panel">


<h2>Oyuncu Ekle</h2>


<label>
Oyuncu Adı
</label>

<input id="playerName" placeholder="Luke Kriss">



<label>
Oyuncu Fotoğrafı
</label>

<input 
type="file"
id="playerImage"
accept="image/*"
>



<h3>Statlar</h3>


<div id="statsContainer">


<div class="stat">

<input class="statName" placeholder="Çeviklik">

<input 
class="statValue"
type="number"
placeholder="80">

</div>


</div>


<button onclick="addStat()">
+ Stat Ekle
</button>



<br><br>


<button class="save"
onclick="savePlayer()">

Oyuncuyu Kaydet

</button>


</section>





<section>


<h2>Oyuncular</h2>


<div id="players">

</div>


</section>



</main>



<script type="module" src="js/app.js"></script>


</body>

</html>
